#Capacity and output rate of the energy cubes
[energy_cubes]
	#Maximum number of Joules Cosmic energy cubes can store. Placed cubes pick up a change when they are loaded again.
	# Default: 2048000000
	# Range: 1 ~ 9223372036854775807
	cosmicStorage = 2048000000
	#Output rate in Joules/t of Cosmic energy cubes.
	# Default: 4096000
	# Range: 1 ~ 9223372036854775807
	cosmicOutput = 4096000
	#Maximum number of Joules Supreme energy cubes can store. Placed cubes pick up a change when they are loaded again.
	# Default: 16384000000
	# Range: 1 ~ 9223372036854775807
	supremeStorage = 16384000000
