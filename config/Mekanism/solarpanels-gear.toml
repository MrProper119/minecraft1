#Settings of the Improved Energy Tablet
[improved_energy_tablet]
	#Maximum amount of Joules the Improved Energy Tablet can store.
	# Default: 3000000
	# Range: 0 ~ 9223372036854775807
	maxEnergy = 3000000
	#Joules/t the Improved Energy Tablet can receive or give.
	# Default: 15000
	# Range: 0 ~ 9223372036854775807
	chargeRate = 15000

